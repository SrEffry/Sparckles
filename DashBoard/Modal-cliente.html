<!-- ========== SECCIÓN CLIENTE CON MODAL DE BÚSQUEDA ========== -->

<div class="form-section-factura">
    <h2 class="section-title-factura">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
        </svg>
        Cliente
    </h2>

    <!-- Botón Seleccionar Cliente -->
    <button type="button" class="btn-seleccionar-cliente" onclick="abrirModalClientes()" id="btnSeleccionarCliente">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
        </svg>
        <span>Seleccionar Cliente</span>
    </button>

    <!-- Tarjeta del cliente seleccionado (oculta inicialmente) -->
    <div id="clienteSeleccionadoCard" class="cliente-card" style="display: none;">
        <div class="cliente-card-header">
            <div class="cliente-info-principal">
                <h3 id="cardNombreCliente">Juan Pérez</h3>
                <span class="badge-tipo" id="cardTipoCliente">Persona Natural</span>
            </div>
            <button type="button" class="btn-cambiar" onclick="abrirModalClientes()" title="Cambiar cliente">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
                </svg>
                Cambiar
            </button>
        </div>
        <div class="cliente-card-body">
            <div class="info-item">
                <span class="info-label">Documento:</span>
                <span class="info-value" id="cardDocumentoCliente">CC 1234567890</span>
            </div>
            <div class="info-item">
                <span class="info-label">Teléfono:</span>
                <span class="info-value" id="cardTelefonoCliente">300 123 4567</span>
            </div>
            <div class="info-item">
                <span class="info-label">Email:</span>
                <span class="info-value" id="cardEmailCliente">cliente@example.com</span>
            </div>
            <div class="info-item">
                <span class="info-label">Dirección:</span>
                <span class="info-value" id="cardDireccionCliente">Calle 123 #45-67</span>
            </div>
        </div>
    </div>
</div>

<!-- ========== MODAL DE BÚSQUEDA DE CLIENTES ========== -->
<div id="modalBusquedaClientes" class="modal-overlay" style="display: none;" onclick="cerrarModalSiClickFuera(event)">
    <div class="modal-contenido" onclick="event.stopPropagation()">
        <!-- Header del Modal -->
        <div class="modal-header">
            <h2>Buscar Cliente</h2>
            <button type="button" class="btn-cerrar-modal" onclick="cerrarModalClientes()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <!-- Barra de Búsqueda -->
        <div class="modal-busqueda">
            <div class="input-busqueda-wrapper">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input 
                    type="text" 
                    id="inputBusquedaCliente" 
                    placeholder="Escribe el nombre o documento del cliente..." 
                    autocomplete="off"
                    oninput="buscarClientesEnTiempoReal()"
                    onkeydown="navegarResultadosTeclado(event)"
                >
                <button type="button" class="btn-limpiar-busqueda" onclick="limpiarBusqueda()" style="display: none;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Resultados de Búsqueda -->
        <div class="modal-resultados" id="resultadosBusqueda">
            <!-- Estado inicial: sin búsqueda -->
            <div class="estado-inicial" id="estadoInicial">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <p>Escribe para buscar clientes</p>
                <small>Busca por nombre o documento</small>
            </div>

            <!-- Lista de resultados (se llena dinámicamente) -->
            <div class="lista-resultados" id="listaResultados" style="display: none;">
                <!-- Los resultados se insertan aquí dinámicamente -->
            </div>

            <!-- Sin resultados -->
            <div class="sin-resultados" id="sinResultados" style="display: none;">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <p>No se encontraron clientes</p>
                <small>Intenta con otro término de búsqueda</small>
            </div>
        </div>

        <!-- Footer del Modal -->
        <div class="modal-footer">
            <button type="button" class="btn-crear-cliente-modal" onclick="irACrearClienteDesdeModal()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Crear Nuevo Cliente
            </button>
            <div class="modal-acciones">
                <button type="button" class="btn-cancelar-modal" onclick="cerrarModalClientes()">
                    Cancelar
                </button>
                <button type="button" class="btn-seleccionar-modal" id="btnConfirmarSeleccion" disabled onclick="confirmarSeleccionCliente()">
                    Seleccionar
                </button>
            </div>
        </div>
    </div>
</div>
